<!-- Wazuh manager — Vila Aurora (RT-12/13). Coleta centralizada de logs JSON/texto de todas as camadas.
     No laboratório os logs chegam por volume compartilhado; em produção, por agente Wazuh em cada nó. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>   <!-- arquivo bruto de todos os eventos: base da forense -->
    <email_notification>no</email_notification>
    <update_check>no</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging><log_format>plain</log_format></logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
  <wodle name="cis-cat"><disabled>yes</disabled></wodle>
  <wodle name="osquery"><disabled>yes</disabled></wodle>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/va-vpn-known-ips</list>
    <list>etc/lists/va-cmd-requesters</list>
  </ruleset>

  <!-- ===== campo/borda ===== -->
  <localfile><log_format>json</log_format><location>/logs/va/*/logs/edge.jsonl</location></localfile>
  <localfile><log_format>syslog</log_format><location>/logs/va/*/logs/mosquitto.log</location></localfile>
  <!-- ===== nuvem ===== -->
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/ingest.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/ingest-gw.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/painel.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/painel-gw.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/painel-legado-gw.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/vpn.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/soar.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/ai.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/logs/va/cloud/logs/pg/postgresql.json</location></localfile>
  <localfile><log_format>syslog</log_format><location>/logs/va/cloud/logs/vpn-legado.log</location></localfile>
</ossec_config>
