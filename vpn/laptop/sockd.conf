# Proxy SOCKS do "notebook do admin": o host só alcança a rede administrativa via túnel wg0
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: wg0
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody
client pass { from: 0.0.0.0/0 to: 0.0.0.0/0 }
socks pass { from: 0.0.0.0/0 to: 10.90.0.1/32 }
socks pass { from: 0.0.0.0/0 to: 172.30.40.0/24 }
socks block { from: 0.0.0.0/0 to: 0.0.0.0/0 log: connect }
