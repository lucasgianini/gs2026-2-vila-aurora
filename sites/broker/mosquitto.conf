# Broker MQTT local de cada espaço comunitário (RT-02 operação local, RT-04 mTLS)
# Mesmo arquivo para os 5 espaços; certificados específicos são montados em /mosquitto/certs.

per_listener_settings false
persistence true
persistence_location /mosquitto/data/
allow_anonymous false

# Única porta: 8883 com TLS 1.3 e certificado de cliente obrigatório.
# Não existe listener 1883 em texto puro.
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.pem
certfile /mosquitto/certs/cert.pem
keyfile  /mosquitto/certs/key.pem
crlfile  /mosquitto/crl/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.3

acl_file /mosquitto/config/acl

# Logs para o SIEM (RT-12): arquivo + stdout, com timestamp ISO
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
