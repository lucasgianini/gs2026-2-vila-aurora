<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="800" viewBox="0 0 1560 800" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#333"/></marker></defs>
<rect width="1560" height="800" fill="#ffffff"/>
<text x="30" y="38" font-size="22" font-weight="bold" fill="#111">Rede Comunitária Vila Aurora — arquitetura em camadas</text>
<text x="30" y="62" font-size="14" fill="#444">Cada espaço opera sozinho; a nuvem consolida. Toda seta é autenticada com certificado nas duas pontas (mTLS).</text>
<rect x="30" y="84" width="290" height="560" rx="10" fill="#2e7d32" fill-opacity="0.06" stroke="#2e7d32" stroke-width="2"/>
<rect x="30" y="84" width="290" height="46" rx="10" fill="#2e7d32"/>
<text x="175.0" y="105" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">CAMPO</text>
<text x="175.0" y="122" font-size="11.5" fill="#fff" text-anchor="middle">sensores e atuadores de cada espaço</text>
<rect x="400" y="84" width="350" height="560" rx="10" fill="#1565c0" fill-opacity="0.06" stroke="#1565c0" stroke-width="2"/>
<rect x="400" y="84" width="350" height="46" rx="10" fill="#1565c0"/>
<text x="575.0" y="105" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">BORDA</text>
<text x="575.0" y="122" font-size="11.5" fill="#fff" text-anchor="middle">1 nó autônomo por espaço (×5)</text>
<rect x="860" y="84" width="360" height="560" rx="10" fill="#6a1b9a" fill-opacity="0.06" stroke="#6a1b9a" stroke-width="2"/>
<rect x="860" y="84" width="360" height="46" rx="10" fill="#6a1b9a"/>
<text x="1040.0" y="105" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">NUVEM</text>
<text x="1040.0" y="122" font-size="11.5" fill="#fff" text-anchor="middle">consolida, detecta e responde</text>
<rect x="1290" y="84" width="240" height="560" rx="10" fill="#bf360c" fill-opacity="0.06" stroke="#bf360c" stroke-width="2"/>
<rect x="1290" y="84" width="240" height="46" rx="10" fill="#bf360c"/>
<text x="1410.0" y="105" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">SUPERVISÃO</text>
<text x="1410.0" y="122" font-size="11.5" fill="#fff" text-anchor="middle">pessoas e decisão</text>
<rect x="44" y="146" width="262" height="78" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="54" y="166" font-size="13.5" font-weight="bold" fill="#111">Sensores</text>
<text x="54" y="184" font-size="11.5" fill="#333">nível, turbidez, cloro residual</text>
<text x="54" y="200" font-size="11.5" fill="#333">câmara fria de vacinas (UBS)</text>
<text x="54" y="216" font-size="11.5" fill="#333">energia, qualidade do ar, alagamento</text>
<rect x="44" y="234" width="262" height="62" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="54" y="254" font-size="13.5" font-weight="bold" fill="#111">Atuadores</text>
<text x="54" y="272" font-size="11.5" fill="#333">bomba de recalque, gerador, relés</text>
<text x="54" y="288" font-size="11.5" fill="#333">só aceitam comando vindo da borda</text>
<rect x="44" y="306" width="262" height="62" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="54" y="326" font-size="13.5" font-weight="bold" fill="#111">Fechaduras RFID / QR</text>
<text x="54" y="344" font-size="11.5" fill="#333">crachá vira pseudônimo (HMAC)</text>
<text x="54" y="360" font-size="11.5" fill="#333">antes de ser armazenado</text>
<rect x="44" y="378" width="262" height="78" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="54" y="398" font-size="13.5" font-weight="bold" fill="#111">Identidade</text>
<text x="54" y="416" font-size="11.5" fill="#333">certificado X.509 único por</text>
<text x="54" y="432" font-size="11.5" fill="#333">dispositivo — sem segredo</text>
<text x="54" y="448" font-size="11.5" fill="#333">compartilhado; ACL por CN</text>
<rect x="414" y="146" width="322" height="46" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="166" font-size="13.5" font-weight="bold" fill="#111">Broker MQTT local</text>
<text x="424" y="184" font-size="11.5" fill="#333">TLS 1.3, certificado de cliente obrigatório, CRL</text>
<rect x="414" y="202" width="322" height="62" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="222" font-size="13.5" font-weight="bold" fill="#111">Agente de borda — regras locais</text>
<text x="424" y="240" font-size="11.5" fill="#333">câmara fria 2–8 °C, nível da bomba, alagamento</text>
<text x="424" y="256" font-size="11.5" fill="#333">alarma e atua SEM internet</text>
<rect x="414" y="274" width="322" height="62" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="294" font-size="13.5" font-weight="bold" fill="#111">Validação de comandos remotos</text>
<text x="424" y="312" font-size="11.5" fill="#333">intertravamentos, horário e perfil</text>
<text x="424" y="328" font-size="11.5" fill="#333">a borda pode recusar a nuvem</text>
<rect x="414" y="346" width="322" height="62" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="366" font-size="13.5" font-weight="bold" fill="#111">Store-and-forward (SQLite)</text>
<text x="424" y="384" font-size="11.5" fill="#333">buffer com prioridade para alarmes</text>
<text x="424" y="400" font-size="11.5" fill="#333">reconciliação idempotente (borda, seq)</text>
<rect x="414" y="418" width="322" height="46" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="438" font-size="13.5" font-weight="bold" fill="#111">Painel local</text>
<text x="424" y="456" font-size="11.5" fill="#333">operação do espaço com a rede fora</text>
<rect x="414" y="474" width="322" height="62" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
<text x="424" y="494" font-size="13.5" font-weight="bold" fill="#111">Uplinks sob WireGuard</text>
<text x="424" y="512" font-size="11.5" fill="#333">fibra (principal) e 4G (modo degradado:</text>
<text x="424" y="528" font-size="11.5" fill="#333">só alarmes, eventos e estados)</text>
<rect x="874" y="146" width="332" height="62" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="166" font-size="13.5" font-weight="bold" fill="#111">Hub VPN + firewall</text>
<text x="884" y="184" font-size="11.5" fill="#333">WireGuard; padrão-negar entre segmentos</text>
<text x="884" y="200" font-size="11.5" fill="#333">borda não alcança outra borda nem o banco</text>
<rect x="874" y="218" width="332" height="46" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="238" font-size="13.5" font-weight="bold" fill="#111">Ingest (mTLS)</text>
<text x="884" y="256" font-size="11.5" fill="#333">só bordas com certificado válido; idempotente</text>
<rect x="874" y="274" width="332" height="62" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="294" font-size="13.5" font-weight="bold" fill="#111">PostgreSQL</text>
<text x="884" y="312" font-size="11.5" fill="#333">um usuário por serviço, privilégio mínimo</text>
<text x="884" y="328" font-size="11.5" fill="#333">dados pessoais segregados e pseudonimizados</text>
<rect x="874" y="346" width="332" height="62" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="366" font-size="13.5" font-weight="bold" fill="#111">SIEM (Wazuh)</text>
<text x="884" y="384" font-size="11.5" fill="#333">logs de todas as camadas, relógios em NTP</text>
<text x="884" y="400" font-size="11.5" fill="#333">regras (a) VPN (b) SQLi (c) certificado (d) atuador</text>
<rect x="874" y="418" width="332" height="62" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="438" font-size="13.5" font-weight="bold" fill="#111">SOAR</text>
<text x="884" y="456" font-size="11.5" fill="#333">baixo risco: automático (isola, revoga, bloqueia)</text>
<text x="884" y="472" font-size="11.5" fill="#333">alto impacto: só propõe</text>
<rect x="874" y="490" width="332" height="62" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="510" font-size="13.5" font-weight="bold" fill="#111">IA defensiva</text>
<text x="884" y="528" font-size="11.5" fill="#333">Isolation Forest + LLM local com guardrails</text>
<text x="884" y="544" font-size="11.5" fill="#333">só rotula — não aciona atuadores</text>
<rect x="874" y="562" width="332" height="46" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="884" y="582" font-size="13.5" font-weight="bold" fill="#111">CA própria (PKI)</text>
<text x="884" y="600" font-size="11.5" fill="#333">raiz + intermediária; emissão, rotação e CRL</text>
<rect x="1304" y="146" width="212" height="78" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
<text x="1314" y="166" font-size="13.5" font-weight="bold" fill="#111">Acesso administrativo</text>
<text x="1314" y="184" font-size="11.5" fill="#333">WireGuard com chave por</text>
<text x="1314" y="200" font-size="11.5" fill="#333">pessoa + MFA (TOTP)</text>
<text x="1314" y="216" font-size="11.5" fill="#333">nenhuma porta exposta</text>
<rect x="1304" y="234" width="212" height="62" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
<text x="1314" y="254" font-size="13.5" font-weight="bold" fill="#111">Gateway + WAF</text>
<text x="1314" y="272" font-size="11.5" fill="#333">HTTPS; assinaturas de SQLi</text>
<text x="1314" y="288" font-size="11.5" fill="#333">barradas com 403</text>
<rect x="1304" y="306" width="212" height="94" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
<text x="1314" y="326" font-size="13.5" font-weight="bold" fill="#111">Painel web</text>
<text x="1314" y="344" font-size="11.5" fill="#333">MFA + RBAC: operador,</text>
<text x="1314" y="360" font-size="11.5" fill="#333">técnico, coordenação, auditor</text>
<text x="1314" y="376" font-size="11.5" fill="#333">consultas parametrizadas</text>
<text x="1314" y="392" font-size="11.5" fill="#333">acessível (WCAG 2.1 AA)</text>
<rect x="1304" y="410" width="212" height="46" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
<text x="1314" y="430" font-size="13.5" font-weight="bold" fill="#111">Console do SOC</text>
<text x="1314" y="448" font-size="11.5" fill="#333">alertas e respostas</text>
<rect x="1304" y="466" width="212" height="62" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
<text x="1314" y="486" font-size="13.5" font-weight="bold" fill="#111">Decisão humana</text>
<text x="1314" y="504" font-size="11.5" fill="#333">alto impacto exige aprovação</text>
<text x="1314" y="520" font-size="11.5" fill="#333">de uma segunda pessoa</text>
<line x1="320" y1="190" x2="400" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="360.0" y="182" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">MQTT</text>
<text x="360.0" y="208" font-size="10.5" fill="#444" text-anchor="middle">mTLS</text>
<line x1="750" y1="330" x2="860" y2="330" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="805.0" y="322" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">fibra</text>
<text x="805.0" y="348" font-size="10.5" fill="#444" text-anchor="middle">WireGuard</text>
<line x1="750" y1="420" x2="860" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="805.0" y="412" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">4G</text>
<text x="805.0" y="438" font-size="10.5" fill="#444" text-anchor="middle">degradado</text>
<line x1="1290" y1="200" x2="1220" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="1255.0" y="192" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">VPN</text>
<text x="1255.0" y="218" font-size="10.5" fill="#444" text-anchor="middle">+ MFA</text>
<line x1="1290" y1="560" x2="1220" y2="560" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="1255.0" y="552" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">aprova</text>
<rect x="30" y="662" width="1500" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
<text x="46" y="686" font-size="13.5" font-weight="bold" fill="#111">Segmentação de rede (padrão-negar entre segmentos)</text>
<text x="46" y="708" font-size="12" fill="#333">IoT de cada espaço (isolada)  ·  WAN fibra  ·  WAN 4G  ·  serviços de nuvem  ·  administração  ·  "internet" simulada do laboratório</text>
<text x="30" y="752" font-size="12" fill="#444">Lição do INC-VA-0712 aplicada: alarme da câmara fria e intertravamento da bomba ficam na BORDA; a queda da fibra degrada a supervisão central, não a operação.</text>
<text x="30" y="772" font-size="12" fill="#444">Linha tracejada = modo degradado.  Protótipo: tudo em containers Docker (docker-compose.yml), dados sintéticos.</text>
</svg>