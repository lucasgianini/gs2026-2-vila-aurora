# Terminação mTLS do ingest (RT-04/RT-06). Só bordas com certificado válido e não revogado.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
  server_tokens off;
  client_max_body_size 2m;

  log_format json escape=json '{"ts":"$time_iso8601","app":"va-ingest-gw","remote":"$remote_addr",'
    '"cn":"$client_cn","verify":"$ssl_client_verify","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes_in":$request_length,"rt":$request_time}';
  access_log /var/log/vilaaurora/ingest-gw.jsonl json;
  error_log  /var/log/vilaaurora/ingest-gw.error.log notice;

  map $ssl_client_s_dn $client_cn { "~(^|,)CN=(?<cn>[^,]+)" $cn; default ""; }
  map $ssl_client_s_dn $client_ou { "~(^|,)OU=(?<ou>[^,]+)" $ou; default ""; }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate         /certs/cert.pem;
    ssl_certificate_key     /certs/key.pem;
    ssl_client_certificate  /certs/ca.pem;
    ssl_crl                 /crl/crl.pem;
    ssl_verify_client       optional;      # /healthz sem cert; resto exige (checado abaixo)
    ssl_verify_depth        2;
    ssl_protocols           TLSv1.3;

    location = /healthz { proxy_pass http://ingest-app:8000; }

    location / {
      if ($ssl_client_verify != SUCCESS) { return 401; }
      proxy_set_header X-Client-CN     $client_cn;
      proxy_set_header X-Client-OU     $client_ou;
      proxy_set_header X-Client-Verify $ssl_client_verify;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://ingest-app:8000;
    }
  }
}
