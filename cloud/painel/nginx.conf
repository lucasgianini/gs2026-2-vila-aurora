# Gateway HTTPS do painel — roda no namespace do hub: só alcançável por 10.90.0.1:443,
# e o firewall do hub só libera após MFA da VPN (RT-06).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 64k;
  log_format json escape=json '{"ts":"$time_iso8601","app":"va-painel-gw","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"ua":"$http_user_agent","rt":$request_time,"waf":"$waf_sqli"}';
  access_log /var/log/vilaaurora/painel-gw.jsonl json;
  # WAF mínimo (camada adicional do RT-08 / C3): assinaturas de SQL Injection na query string.
  # NÃO é a correção — a correção é a consulta parametrizada + validação na aplicação. Aqui a
  # requisição suspeita é barrada (403) antes de chegar ao painel e fica registrada ("waf":"1").
  map $args $waf_sqli {
    default 0;
    "~*(%27|')(\s|%20|\+)*(or|and|union|;|--|%3b|\))"                1;
    "~*union(\s|%20|\+|/\*.*\*/)+(all(\s|%20|\+)+)?select"           1;
    "~*(pg_sleep|information_schema|pg_catalog|pg_shadow)"           1;
    "~*(;|%3b)(\s|%20|\+)*(select|update|delete|drop|insert|alter)"  1;
    "~*(--|%2d%2d|/\*|%2f%2a)"                                       1;
  }
  resolver 127.0.0.11 valid=10s;
  server {
    listen 10.90.0.1:443 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem; ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $up painel-app;
    location / {
      if ($waf_sqli) { return 403; }
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://$up:8000;
    }
  }
}
