# Gateway HTTPS do painel. Na fase 3 só é alcançável pela VPN administrativa (RT-06).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 64k;
  log_format json escape=json '{"ts":"$time_iso8601","app":"va-painel-gw","upstream":"$upstream_name","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"ua":"$http_user_agent","rt":$request_time}';
  access_log /var/log/vilaaurora/painel-gw.jsonl json;
  map $server_port $upstream_name { 8443 painel-app; 9443 painel-legado-app; }
  resolver 127.0.0.11 valid=10s;
  server {
    listen 8443 ssl;
    listen 9443 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem; ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://$upstream_name:8000;
    }
  }
}
